<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un pensamiento vago que llevo a ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09070c;--page-ink:#d9c3cf;--paper:#150f19;--paper-ink:#f4e6ee;--muted:#a58f9c;
  --accent:#f07aa6;--on-accent:#1a0f16;--line:#3a2a38;--tape:rgba(240,122,166,.30);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100vh;color:var(--page-ink);
  background:radial-gradient(60rem 30rem at 50% -10%,rgba(240,122,166,.24),transparent 70%),radial-gradient(40rem 26rem at 90% 108%,rgba(240,122,166,.12),transparent 70%),var(--bg);
  font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
}
.stage{min-height:100vh;display:grid;place-items:center;padding:2.75rem 1.25rem}
.wrap{width:min(100%,34rem);display:flex;flex-direction:column;align-items:center}
.letter{
  width:100%;position:relative;background:var(--paper);color:var(--paper-ink);
  border-radius:6px 6px 14px 14px;padding:2.4rem 2rem 1.8rem;transform:rotate(-.7deg);
  box-shadow:0 0 0 1px rgba(240,122,166,.22),0 30px 70px -30px rgba(240,122,166,.45);
}
.letter::before{
  content:"";position:absolute;top:-.85rem;left:50%;width:7rem;height:1.7rem;
  transform:translateX(-50%) rotate(2deg);background:var(--tape);
}
h1{
  margin:0 0 .4rem;font-family:Fraunces,Georgia,serif;font-weight:600;
  font-size:clamp(1.9rem,6.5vw,2.6rem);line-height:1.1;letter-spacing:-.01em;overflow-wrap:anywhere;
}
.sub{margin:0;color:var(--muted);font-size:.95rem}
.btn{
  min-height:2.75rem;padding:0 1.2rem;border-radius:999px;border:1px solid transparent;
  background:var(--accent);color:var(--on-accent);font:600 .95rem Manrope,system-ui,sans-serif;
  display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;
}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.open{margin-top:1.6rem}
.letter[data-open="true"] .open{display:none}
.sheet{display:grid;grid-template-rows:0fr;transition:grid-template-rows 1s cubic-bezier(.2,.7,.2,1)}
.letter[data-open="true"] .sheet{grid-template-rows:1fr}
.inner{overflow:hidden;min-height:0}
.body{padding-top:1.4rem}
.body p{
  margin:0 0 1.1rem;font-family:Fraunces,Georgia,serif;font-size:1.16rem;line-height:1.72;
  opacity:0;transform:translateY(6px);
}
.letter[data-open="true"] .body p,.letter[data-open="true"] .sign,.letter[data-open="true"] .music{
  animation:in .9s ease forwards;animation-delay:calc(var(--i,0) * .6s + .6s);
}
.sign{margin:1.4rem 0 0;font-family:Fraunces,Georgia,serif;font-style:italic;font-size:1.15rem;line-height:1.5;opacity:0}
.music{
  display:flex;flex-wrap:wrap;align-items:center;gap:1rem;margin-top:1.8rem;padding-top:1.3rem;
  border-top:1px dashed var(--line);opacity:0;
}
.rec{
  width:4.5rem;aspect-ratio:1;flex:none;border-radius:50%;position:relative;
  background:
    conic-gradient(transparent 0 18%,rgba(255,255,255,.22) 25%,transparent 32% 68%,rgba(255,255,255,.22) 75%,transparent 82%),
    repeating-radial-gradient(circle,#1d1a28 0 2px,#2a2638 2px 4px);
  box-shadow:0 8px 16px -8px rgba(0,0,0,.7);
}
.rec::before{content:"";position:absolute;inset:31%;border-radius:50%;background:var(--accent)}
.rec::after{content:"";position:absolute;inset:47%;border-radius:50%;background:var(--paper)}
.rec.spin{animation:spin 5s linear infinite}
.track{flex:1 1 9rem;min-width:0}
.track b{display:block;font-family:Fraunces,Georgia,serif;font-size:1.1rem;font-weight:600;overflow-wrap:anywhere}
.track span{color:var(--muted);font-size:.9rem}
.edit{margin-top:1.8rem}
dialog{
  width:min(92vw,30rem);border:0;border-radius:14px;padding:1.4rem;background:var(--paper);color:var(--paper-ink);
}
dialog::backdrop{background:rgba(10,8,18,.62)}
dialog h2{margin:0 0 1rem;font-family:Fraunces,Georgia,serif;font-size:1.4rem}
label{display:block;margin-bottom:.85rem;font-size:.85rem;font-weight:600}
input,textarea{
  display:block;width:100%;margin-top:.3rem;padding:.65rem .75rem;border:1px solid var(--line);border-radius:8px;
  background:#0f0b13;color:var(--paper-ink);font:400 1rem Manrope,system-ui,sans-serif;
}
textarea{resize:vertical;line-height:1.5}
.hint{margin:0 0 1rem;color:var(--muted);font-size:.82rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:flex-end}
.row .btn.ghost{color:var(--paper-ink)}
.lyrics{margin-top:1.4rem;padding:1.1rem 1rem;border-radius:10px;background:rgba(240,122,166,.09);text-align:center}
.l-prev,.l-next{margin:0;min-height:1.4em;color:var(--muted);font-size:.92rem}
.l-cur{color:var(--accent);margin:.5rem 0;min-height:2.7em;display:flex;align-items:center;justify-content:center;font-family:Fraunces,Georgia,serif;font-size:1.45rem;line-height:1.35}
.lctl{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:.9rem}
.lyrics .hint{margin:.8rem 0 0}
.btn.sm{min-height:2.4rem;padding:0 .9rem;font-size:.85rem}
dialog{max-height:88vh;overflow:auto}
@keyframes in{to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .body p,.sign,.music{opacity:1!important;transform:none!important}
}
.out{width:100%;margin-top:.8rem;min-height:7rem;font-size:.85rem}
.dark{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:2rem 1.5rem;text-align:center;color:#f0dce6;
  background:radial-gradient(32rem 22rem at 50% 45%,rgba(240,122,166,.20),transparent 70%),#050407;
  transition:opacity 1.8s ease,visibility 0s linear 1.8s}
.dark.off{opacity:0;visibility:hidden;pointer-events:none}
.darkin{max-width:30rem}
.dark p{margin:0 0 1.5rem;font-family:Fraunces,Georgia,serif;font-size:clamp(1.25rem,4.6vw,1.75rem);line-height:1.5;
  opacity:0;animation:glow 2.2s ease forwards;animation-delay:calc(var(--i) * 3s + .8s)}
.dark .btn{margin-top:.6rem;opacity:0;animation:glow 1.6s ease forwards;animation-delay:calc(var(--n) * 3s + .8s)}
@keyframes glow{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
@media (prefers-reduced-motion:reduce){.dark p,.dark .btn{opacity:1!important;filter:none!important}}
</style>
</head>
<body>
<section class="dark" id="dark" aria-label="Introducción">
  <div class="darkin">
    <div id="scene"></div>
    <button class="btn" id="lightBtn" type="button">Encender la luz</button>
  </div>
</section>
<main class="stage">
  <div class="wrap">
    <article class="letter" id="letter" data-open="false">
      <h1 id="to"></h1>
      <p class="sub">Un pensamiento vago que llevo a ti</p>
      <button class="btn open" id="openBtn" type="button">Abrir carta</button>
      <div class="sheet">
        <div class="inner">
          <div class="body" id="body"></div>
          <p class="sign" id="sign"></p>
          <div class="music" id="music">
            <div class="rec" id="rec" aria-hidden="true"></div>
            <div class="track"><b id="song"></b><span id="artist"></span></div>
            <button class="btn" id="play" type="button">Reproducir</button>
          </div>
          <section class="lyrics" id="lyrics">
            <p class="l-prev" id="l-prev"></p>
            <p class="l-cur" id="l-cur"></p>
            <p class="l-next" id="l-next"></p>
            <div class="lctl">
              <button class="btn ghost sm" id="lr" type="button">Reiniciar</button>
              <button class="btn ghost sm" id="ls" type="button">Sincronizar tocando</button>
              <button class="btn ghost sm" id="ln" type="button">Más pronto</button>
              <button class="btn ghost sm" id="lt" type="button">Más tarde</button>
            </div>
            <p class="hint" id="lhint"></p>
            <textarea class="out" id="out" readonly hidden></textarea>
          </section>
        </div>
      </div>
    </article>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const L = { lines: [], idx: -2, syncing: false, marks: [], offset: 0 };
const audio = new Audio();
const STAMP = /^\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\]\s*/;

function parseLyrics(text) {
  const out = [];
  text.split(/\r?\n/).forEach((raw) => {
    const line = raw.trim();
    if (!line) return;
    const m = STAMP.exec(line);
    out.push({ text: line.replace(STAMP, ''), t: m ? (+m[1]) * 60 + (+m[2]) + (m[3] ? +('0.' + m[3]) : 0) : null });
  });
  return out.filter((l) => l.text);
}
function stamp(t) {
  const cs = Math.round(t * 100);
  const mm = String(Math.floor(cs / 6000)).padStart(2, '0');
  const ss = ((cs % 6000) / 100).toFixed(2).padStart(5, '0');
  return '[' + mm + ':' + ss + ']';
}
function currentIndex() {
  const n = L.lines.length, t = audio.currentTime - L.offset;
  if (L.lines.every((l) => l.t !== null)) {
    let i = -1;
    for (let k = 0; k < n; k++) if (L.lines[k].t <= t) i = k;
    return i;
  }
  const dur = isFinite(audio.duration) ? audio.duration : 213;
  return Math.min(n - 1, Math.floor(t / (dur / n)));
}
function showLine() {
  if (!L.lines.length || L.syncing) return;
  const i = currentIndex();
  if (i === L.idx) return;
  L.idx = i;
  const get = (k) => (L.lines[k] ? L.lines[k].text : '');
  $('l-prev').textContent = get(i - 1);
  $('l-cur').textContent = i < 0 ? '…' : get(i);
  $('l-next').textContent = get(i + 1);
}
function setLyrics(text) {
  L.lines = parseLyrics(text || '');
  L.idx = -2;
  if (L.lines.length) showLine();
  else {
    $('l-cur').textContent = 'Aquí saldrá la letra';
    $('lhint').textContent = 'Pega la letra en www/lyrics.txt, una línea por renglón.';
  }
}
function promptSync() {
  const n = L.marks.length;
  $('l-prev').textContent = n ? L.lines[n - 1].text : '';
  $('l-cur').textContent = L.lines[n].text;
  $('l-next').textContent = 'Espacio cuando empiece a cantarse · Retroceso deshace · Esc cancela';
}
function startSync() {
  if (!L.lines.length) return;
  if (document.activeElement) document.activeElement.blur();
  audio.currentTime = 0;
  audio.play().catch(() => {});
  L.offset = 0;
  L.syncing = true; L.marks = [];
  $('out').hidden = true;
  promptSync();
}
function finishSync() {
  L.syncing = false;
  const text = L.lines.map((l, i) => stamp(L.marks[i]) + ' ' + l.text).join('\n');
  setLyrics(text);
  $('out').value = text; $('out').hidden = false; $('out').select();
  if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
  $('lhint').textContent = 'Listo, y ya está copiada. Pégala en www/lyrics.txt (reemplaza todo), guarda y vuelve a compilar.';
}
document.addEventListener('keydown', (e) => {
  if (!L.syncing) return;
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    L.marks.push(Math.max(0, audio.currentTime - 0.25));
    if (L.marks.length >= L.lines.length) finishSync(); else promptSync();
  } else if (e.code === 'Backspace' && L.marks.length) {
    e.preventDefault(); L.marks.pop(); promptSync();
  } else if (e.code === 'Escape') {
    L.syncing = false; L.idx = -2; showLine();
  }
});

audio.addEventListener('play', () => { $('rec').classList.add('spin'); $('play').textContent = 'Pausar'; });
['pause', 'ended'].forEach((ev) => audio.addEventListener(ev, () => { $('rec').classList.remove('spin'); $('play').textContent = 'Reproducir'; }));
audio.addEventListener('error', () => {
  $('play').disabled = true;
  $('lhint').textContent = 'No se pudo cargar el audio. Revisa que el archivo de audio esté en la carpeta www y que su nombre coincida con config.json.';
});
$('play').addEventListener('click', () => { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); });
$('lr').addEventListener('click', () => { audio.currentTime = 0; L.idx = -2; showLine(); });
$('ls').addEventListener('click', startSync);
function nudge(d) {
  L.offset = Math.round((L.offset + d) * 100) / 100;
  L.idx = -2; showLine();
  $('lhint').textContent = 'Ajuste: ' + (L.offset > 0 ? '+' : '') + L.offset + ' s. Para dejarlo fijo, pon ese número en lyricsOffsetSeconds de config.json.';
}
$('ln').addEventListener('click', () => nudge(-0.5));
$('lt').addEventListener('click', () => nudge(0.5));
$('openBtn').addEventListener('click', () => { $('letter').dataset.open = 'true'; });
setInterval(showLine, 200);

const DEFAULT_CFG = {
  "titulo": "something ’bout you",
  "para": "alguien especial",
  "de": "ILVU ❤️",
  "mensaje": "No siempre sé decir lo que siento, pero siempre sé a quién se lo diría primero.\n\nContigo hasta el silencio se parece a estar en casa.\n\nLo que no supe demostrar, intento decirlo así: sin apuro y sin disfraz.\n\nPuede que esta canción lo exprese un poco mejor.",
  "cancion": "Lovers Rock",
  "artista": "TV Girl",
  "lyricsOffsetSeconds": 0,
  "escena": [
    "Me acordé de aquella vez, en esa habitación con las luces apagadas.",
    "De cómo salieron esas palabras, confesando un amor.",
    "Sé que soy poco expresivo y que no supe demostrarlo."
  ]
};

async function init() {
  let cfg = {};
  try { cfg = await (await fetch('config.json')).json(); } catch (e) {}
  if (!cfg || !cfg.mensaje) cfg = DEFAULT_CFG;
  const para = cfg.para || 'alguien especial';
  $('to').textContent = cfg.titulo || ('Para ' + para);
  document.title = 'Un pensamiento vago que llevo a ti';
  const paras = String(cfg.mensaje || '').split(/\n\s*\n/).map((t) => t.trim()).filter(Boolean);
  paras.forEach((t, i) => {
    const p = document.createElement('p');
    p.textContent = t; p.style.setProperty('--i', i);
    $('body').appendChild(p);
  });
  $('sign').style.setProperty('--i', paras.length);
  $('sign').style.whiteSpace = 'pre-line';
  $('sign').textContent = cfg.de || 'ILVU ❤️';
  $('music').style.setProperty('--i', paras.length + 1);
  $('song').textContent = cfg.cancion || 'Nuestra canción';
  $('artist').textContent = cfg.artista || '';
  L.offset = Number(cfg.lyricsOffsetSeconds) || 0;
  const esc = Array.isArray(cfg.escena) ? cfg.escena.filter(Boolean) : [];
  if (!esc.length) $('dark').remove();
  else {
    esc.forEach((t, i) => {
      const p = document.createElement('p');
      p.textContent = t; p.style.setProperty('--i', i);
      $('scene').appendChild(p);
    });
    $('dark').style.setProperty('--n', esc.length);
    $('lightBtn').addEventListener('click', () => $('dark').classList.add('off'));
  }
  if (cfg.audioFile) { audio.preload = 'metadata'; audio.src = cfg.audioFile; }
  else { $('play').disabled = true; $('lhint').textContent = 'Falta audioFile en config.json.'; }
  try { const r = await fetch('lyrics.txt'); setLyrics(r.ok ? await r.text() : ''); } catch (e) { setLyrics(''); }
}
init();
</script>
</body>
</html>
